[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tactile-toolkit"
version = "0.1.0"
description = "Universal ingestion, calibration, and standardized dataset engine for robotic tactile sensing."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Tactile Data Toolkit contributors" }]
keywords = ["robotics", "tactile", "gelsight", "dataset", "zarr", "hdf5", "lerobot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "zarr>=3.0",
  "h5py>=3.10",
  "pyarrow>=15",
  "av>=12",
  "mcap>=1.1",
  "mcap-ros2-support>=0.5",
  "rosbags>=0.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "psutil>=5.9",
  "torch>=2.1",
]

[project.scripts]
tactile = "tactile_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/EltonChang1/tactile-data-toolkit"
Issues = "https://github.com/EltonChang1/tactile-data-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tactile_toolkit"]

[tool.hatch.build.targets.sdist]
include = ["src/tactile_toolkit", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
package = true

[tool.coverage.run]
source = ["tactile_toolkit"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "NPY"]
ignore = ["B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["tactile_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running tests (benchmarks, large synthetic trajectories)",
]
filterwarnings = [
  "ignore::DeprecationWarning:rosbags.*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
